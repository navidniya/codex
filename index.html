<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>TikTok Template Editor</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css" />
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
    }
    header {
      background: #000;
      color: #fff;
      padding: 1rem;
      text-align: center;
    }
    #templates {
      display: flex;
      overflow-x: auto;
      padding: 1rem;
      gap: 1rem;
    }
    .template-card {
      flex: 0 0 auto;
      width: 150px;
      border: 1px solid #ccc;
      border-radius: 4px;
      text-align: center;
      cursor: pointer;
    }
    .template-card img {
      width: 100%;
      height: 100px;
      object-fit: cover;
      border-bottom: 1px solid #ccc;
    }
    #editor {
      padding: 1rem;
    }
    #slotList {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
    }
    .slot-item {
      width: 200px;
    }
    .slot-item img, .slot-item video {
      width: 100%;
      max-height: 200px;
    }
    #outputVideo {
      width: 300px;
      margin-top: 1rem;
    }
  </style>
</head>
<body>
  <header>
    <h1>TikTok Template Editor</h1>
  </header>
  <section id="templates"></section>
  <section id="editor" style="display:none;">
    <h2 id="templateTitle"></h2>
    <div id="slotList"></div>
    <button id="exportBtn">Export Video</button>
    <video id="outputVideo" controls style="display:none;"></video>
  </section>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.11.6/dist/ffmpeg.min.js"></script>
  <script>
    const { createFFmpeg, fetchFile } = FFmpeg;
    const ffmpeg = createFFmpeg({ log: true });

    const templates = [
      { id: 1, title: 'Three Clips', slots: 3, thumbnail: 'https://placekitten.com/200/300' },
      { id: 2, title: 'Two Clips', slots: 2, thumbnail: 'https://placekitten.com/200/301' }
    ];

    const templateContainer = document.getElementById('templates');
    const slotList = document.getElementById('slotList');
    const editor = document.getElementById('editor');
    const templateTitle = document.getElementById('templateTitle');
    const exportBtn = document.getElementById('exportBtn');
    const outputVideo = document.getElementById('outputVideo');

    let selectedTemplate = null;
    let slots = [];

    function renderTemplates() {
      templates.forEach(t => {
        const card = document.createElement('div');
        card.className = 'template-card';
        card.innerHTML = `<img src="${t.thumbnail}" alt="thumbnail"><p>${t.title}</p>`;
        card.addEventListener('click', () => selectTemplate(t));
        templateContainer.appendChild(card);
      });
    }

    function selectTemplate(t) {
      selectedTemplate = t;
      templateTitle.textContent = t.title;
      editor.style.display = 'block';
      slotList.innerHTML = '';
      slots = [];
      for (let i = 0; i < t.slots; i++) {
        const div = document.createElement('div');
        div.className = 'slot-item';
        div.innerHTML = `<input type="file" accept="image/*,video/*" data-index="${i}">`;
        slotList.appendChild(div);
        div.querySelector('input').addEventListener('change', handleFile);
        slots.push({ container: div, file: null, cropper: null });
      }
      Sortable.create(slotList, { animation: 150, onEnd: updateOrder });
    }

    function updateOrder(evt) {
      const items = slotList.querySelectorAll('.slot-item');
      const newOrder = Array.from(items).map(item => parseInt(item.querySelector('input').dataset.index, 10));
      slots = newOrder.map(idx => slots[idx]);
      slots.forEach((slot, i) => slot.container.querySelector('input').dataset.index = i);
    }

    function handleFile(e) {
      const input = e.target;
      const file = input.files[0];
      const index = parseInt(input.dataset.index, 10);
      const slot = slots[index];
      slot.file = file;
      slot.container.innerHTML = '';
      if (file.type.startsWith('image/')) {
        const img = document.createElement('img');
        img.src = URL.createObjectURL(file);
        slot.container.appendChild(img);
        const cropper = new Cropper(img, { viewMode: 1, autoCropArea: 1 });
        slot.cropper = cropper;
      } else if (file.type.startsWith('video/')) {
        const video = document.createElement('video');
        video.controls = true;
        video.src = URL.createObjectURL(file);
        slot.container.appendChild(video);
        // For simplicity we do not implement cropping on video
      }
    }

    async function exportVideo() {
      if (!ffmpeg.isLoaded()) {
        await ffmpeg.load();
      }
      slotList.querySelectorAll('input').forEach(i => i.remove());
      const concatList = [];
      for (let i = 0; i < slots.length; i++) {
        const slot = slots[i];
        if (!slot.file) continue;
        const fileName = `input${i}${slot.file.name}`;
        ffmpeg.FS('writeFile', fileName, await fetchFile(slot.file));
        if (slot.cropper) {
          const crop = slot.cropper.getData();
          const cropped = `cropped${i}.mp4`;
          await ffmpeg.run(
            '-i', fileName,
            '-vf', `crop=${crop.width}:${crop.height}:${crop.x}:${crop.y}`,
            '-t', '2',
            '-pix_fmt', 'yuv420p',
            '-preset', 'veryfast',
            cropped
          );
          concatList.push(`file ${cropped}`);
        } else {
          const outName = `processed${i}.mp4`;
          await ffmpeg.run(
            '-i', fileName,
            '-t', '2',
            '-c', 'copy',
            outName
          );
          concatList.push(`file ${outName}`);
        }
      }
      ffmpeg.FS('writeFile', 'concat.txt', concatList.join('\n'));
      await ffmpeg.run('-f', 'concat', '-safe', '0', '-i', 'concat.txt', '-c', 'copy', 'output.mp4');
      const data = ffmpeg.FS('readFile', 'output.mp4');
      const videoURL = URL.createObjectURL(new Blob([data.buffer], { type: 'video/mp4' }));
      outputVideo.src = videoURL;
      outputVideo.style.display = 'block';
    }

    exportBtn.addEventListener('click', exportVideo);

    renderTemplates();
  </script>
</body>
</html>
